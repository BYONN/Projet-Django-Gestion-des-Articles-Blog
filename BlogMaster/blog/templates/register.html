{% extends 'base.html' %}
{% block title %}Créer un compte{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h2 class="text-center mb-4">Créer un compte</h2>

                    {% if error %}
                    <div class="alert alert-danger" role="alert">{{error}}</div>
                    {% endif %}

                    <form method="POST" action="/register/" class="mb-3">
                        {% csrf_token %}


                        <div class="row" >
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Prénom <span class="text-danger">*</span></label>
                                <input type="text" name="firstname" class="form-control" required>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Nom <span class="text-danger">*</span></label>
                                <input type="text" name="lastname" class="form-control" required>
                            </div>
                    </div>

                        <div class="mb-3">
                            <label class="form-label">Nom d'utilisateur <span class="text-danger">*</span></label>
                            <input type="text" name="username" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Adresse email <span class="text-danger">*</span></label>
                            <input type="email" name="email" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Mot de passe <span class="text-danger">*</span></label>
                            <input type="password" name="password" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Confirmer mot de passe <span class="text-danger">*</span></label>
                            <input type="password" name="password2" class="form-control" required>
                        </div>

                        <button class="btn btn-primary w-100" type="submit">Connecter</button>
                    </form>
                    <p class="text-center">Vous avez déja un compte? <a href="/login/">Connectez-vous ici</a></p>
                </div>
            </div>
        </div>

    </div>
</div>
{% endblock %}
