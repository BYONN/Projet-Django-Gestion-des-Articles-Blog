{% extends 'base.html' %}

{% block title %} Créer un article {% endblock %}

{% block content %}
    <div class="container mt-5 mb-5">
        <div class="justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h2 class="mb-4">
                            Créer un nouvel article
                        </h2>

                        <form action="/article/add/" method="POST">
                            {% csrf_token %}

                            <div class="mb-3">
                                <label class="form-label">Titre de l'article <span class="text-danger">*</span></label>
                                <input type="text" name="titre" class="form-control" required>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Catégorie <span class="text-danger">*</span></label>
                                    
                                    <select name="type_contenu" class="form-select" required>
                                        <option value="" disabled selected>Choisissez une catégorie...</option>
                                        {% for category in categories %}

                                            <option value="{{category.id}}">{{category}}</option>
                                        {% endfor %}
                                    </select>
                                </div>
                           

                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Statut <span class="text-danger">*</span></label>

                                    <select name="statut" class="form-select" required>
                                        <option value="Brouillon">Brouillon</option>
                                        <option value="Publié">Publié</option>
                                    </select>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label">Contenu <span class="text-danger">*</span></label>

                                <textarea name="contenu" class="form-control" rows="12" required> </textarea>
                            </div>

                            <button type="submit" class="btn btn-primary w-100">Enregistrer l'article</button>

                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
