{% extends 'base.html' %}
{% block title %}Connexion{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h2 class="text-center mb-4">S'authentifier</h2>


                    <form method="POST" action="/login/" class="mb-3">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label">Nom d'utilisateur <span class="text-danger">*</span></label>
                            <input type="text" name="username" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Mot de passe <span class="text-danger">*</span></label>
                            <input type="password" name="password" class="form-control" required>
                        </div>

                        <button class="btn btn-primary w-100" type="submit">Connecter</button>
                    </form>
                    <p class="text-center">Pas de compte? <a href="/register/">Créer un compte</a></p>
                </div>
            </div>
        </div>

    </div>
</div>
{% endblock %}
